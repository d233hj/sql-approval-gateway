name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    # The desktop shell and deploy scripts target Windows; core/web are portable.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build shared + core
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Build web SPA
        run: npm run build:web

      - name: Core tests
        run: npm test --workspace=@sql-approval/core

      - name: Web transport tests
        run: node --test --test-isolation=none packages/web/src/api.embed.test.mjs

      - name: MCP tests
        run: npm test --workspace=@sql-approval/mcp

      - name: Desktop helper tests
        run: npm test --workspace=@sql-approval/desktop
